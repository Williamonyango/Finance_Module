<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">EcclesiaERP logo</title>
  <desc id="desc">Navy and gold church finance management logo with a church, cross, coins, growth chart and open book.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D58A"/>
      <stop offset="1" stop-color="#C99A3B"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(34 34)">
    <!-- Halo -->
    <path d="M88 235 A155 155 0 1 1 392 235" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <!-- Church roof and body -->
    <path d="M78 210 L240 112 L402 210 Z" fill="#102A50"/>
    <rect x="103" y="204" width="274" height="142" rx="5" fill="#102A50"/>
    <!-- Steeple and cross -->
    <path d="M220 122 V55 H260 V122" fill="#102A50"/>
    <path d="M240 18 V87 M207 52 H273" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="square"/>
    <!-- Windows -->
    <g fill="url(#gold)">
      <path d="M145 235 a24 24 0 0 1 48 0 v55 h-48z"/>
      <path d="M287 235 a24 24 0 0 1 48 0 v55 h-48z"/>
    </g>
    <g stroke="#102A50" stroke-width="5">
      <path d="M169 213 V290 M145 261 H193 M311 213 V290 M287 261 H335"/>
    </g>
    <!-- Financial bars -->
    <g fill="#173B68">
      <rect x="206" y="280" width="22" height="66" rx="2"/>
      <rect x="236" y="258" width="22" height="88" rx="2"/>
      <rect x="266" y="238" width="22" height="108" rx="2"/>
    </g>
    <!-- Coin stacks -->
    <g fill="url(#gold)" stroke="#102A50" stroke-width="3">
      <ellipse cx="139" cy="321" rx="34" ry="11"/>
      <path d="M105 321 v-31 c0 14 68 14 68 0 v31 c0 14-68 14-68 0z"/>
      <ellipse cx="139" cy="290" rx="34" ry="11"/>
      <ellipse cx="203" cy="332" rx="31" ry="10"/>
      <path d="M172 332 v-25 c0 13 62 13 62 0 v25 c0 13-62 13-62 0z"/>
      <ellipse cx="203" cy="307" rx="31" ry="10"/>
    </g>
    <!-- Growth arrow -->
    <path d="M215 285 Q278 268 330 211" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M313 207 L341 197 L337 226 Z" fill="url(#gold)"/>
    <!-- Open book -->
    <path d="M30 354 Q112 320 240 377 Q368 320 450 354 L450 385 Q345 358 240 405 Q135 358 30 385 Z" fill="#102A50"/>
    <path d="M30 354 Q112 320 240 377 Q368 320 450 354" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M240 377 V405" stroke="url(#gold)" stroke-width="5"/>
  </g>

  <!-- Divider -->
  <path d="M535 75 V345" stroke="url(#gold)" stroke-width="4"/>

  <!-- Wordmark -->
  <g font-family="Inter, Montserrat, Arial, sans-serif">
    <text x="585" y="190" font-size="91" font-weight="750" letter-spacing="-3" fill="#102A50">Ecclesia<tspan fill="#C99A3B">ERP</tspan></text>
    <text x="591" y="247" font-size="25" font-weight="650" letter-spacing="7" fill="#102A50">CHURCH FINANCIAL MANAGEMENT</text>
    <path d="M590 282 H1145" stroke="url(#gold)" stroke-width="3"/>
    <path d="M866 269 V295 M854 282 H878" stroke="#C99A3B" stroke-width="5" stroke-linecap="square"/>
    <text x="591" y="331" font-size="25" font-style="italic" font-weight="500" fill="#52647A">Transparency. Accountability. Stewardship.</text>
  </g>
</svg>
